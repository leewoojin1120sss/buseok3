<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#184e40">
<meta name="description" content="부석고등학교 1학년 2학기 6개 과목 성적 기록과 성취도 계산">
<title>학기 기록 · 부석고 2026</title>
<style>
:root{color-scheme:light;--bg:#f4f5f0;--ink:#203a31;--muted:#728077;--line:#e3e8df;--green:#184e40;--accent:#d6eb9f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #8fae58;outline-offset:4px}button{background:white;border:1px solid var(--line);border-radius:10px;padding:9px 15px;color:var(--ink)}button:hover{background:#eaf0e5}header{border-bottom:1px solid var(--line);background:#fcfdf9}.topbar{max-width:1240px;margin:auto;padding:23px 32px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;background:var(--green);color:var(--accent);width:38px;height:38px;border-radius:11px;font-size:23px;font-weight:700}.brand strong{font-size:17px;letter-spacing:-.8px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.4px}.top-right{display:flex;gap:18px;align-items:center}.save-status{font-size:12px;color:var(--muted)}.save-status:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#72a378;margin-right:6px}main{max-width:1240px;margin:auto;padding:36px 32px 22px}.hero{display:grid;grid-template-columns:1.15fr 1fr;background:var(--green);color:#fff;border-radius:24px;padding:35px 38px;gap:30px;position:relative;overflow:hidden}.eyebrow{color:#cce39d;font-size:11px;letter-spacing:2px;font-weight:650}h1{font-size:32px;font-weight:650;letter-spacing:-1.7px;line-height:1.35;margin:10px 0 12px}.hero p{margin:0;font-size:13px;color:#c4d4cc}.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);align-items:center;gap:12px}.hero-stats>div{padding-left:24px;border-left:1px solid #507567}.hero-stats small{display:block;color:#c4d4cc;font-size:12px}.hero-stats strong{display:block;font-size:34px;letter-spacing:-1px;font-weight:550;margin:6px 0 0;font-variant-numeric:tabular-nums}.hero-stats em{font-style:normal;font-size:13px;color:#c4d4cc;margin-left:4px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 16px}h2{font-size:18px;letter-spacing:-.6px;margin:0}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.legend b{font-size:12px;color:var(--green);margin-right:3px}.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.subject{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;padding:23px 25px 19px;gap:12px}.subject-title{display:flex;align-items:center;gap:12px}.index{display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;width:42px;height:42px;font-family:Georgia,serif;font-size:21px;color:#7e987d;background:#fafbf8}h3{margin:0;font-size:19px;letter-spacing:-.6px}.subject-title small{display:block;font-size:11px;color:var(--muted);margin-top:1px}.grade{min-width:42px;height:42px;display:grid;place-items:center;border-radius:13px;font-size:23px;font-weight:650;background:#f2f4ef;color:#8a958c}.grade[data-grade=A]{background:#e8f2cd;color:#406517}.grade[data-grade=B]{background:#e3efeb;color:#27694f}.grade[data-grade=C]{background:#e8edf9;color:#5369a5}.grade[data-grade=D]{background:#fbefd9;color:#946a26}.grade[data-grade=E]{background:#fae7e1;color:#a75b46}.fields{padding:0 25px}.field{display:grid;grid-template-columns:minmax(0,1fr) 48px 96px;align-items:center;gap:12px;min-height:68px;border-top:1px solid #eef0eb;padding:11px 0}.field label{font-size:12px;line-height:1.55;word-break:keep-all}.kind{display:block;font-size:10px;color:var(--muted);margin-bottom:2px;letter-spacing:.5px}.weight{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}.input-wrap{position:relative}input{width:100%;padding:10px 23px 10px 8px;border:1px solid #dfe5d9;border-radius:9px;background:#fafbf8;color:var(--ink);text-align:right;font-size:15px;font-weight:550;font-variant-numeric:tabular-nums;outline:none;appearance:textfield}input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{appearance:none;margin:0}input:focus{border-color:#64916e;box-shadow:0 0 0 3px #e8f0dc;background:#fff}input::placeholder{color:#b6beb1}input[aria-invalid=true]{border-color:#c27b66;background:#fff5f0}.unit{position:absolute;right:9px;top:12px;color:#899581;font-size:11px;pointer-events:none}.field-error{grid-column:1/-1;color:#ac593f;font-size:11px;text-align:right}.field-error:empty{display:none}.card-bottom{margin-top:12px;padding:19px 25px 21px;background:#fafbf8;border-top:1px solid var(--line)}.result-row{display:flex;justify-content:space-between;align-items:end;gap:10px}.result-label{font-size:11px;color:var(--muted)}.result-score{font-size:26px;letter-spacing:-.8px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}.result-score small{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}.result-detail{text-align:right;color:var(--muted);font-size:11px}.result-detail strong{display:block;color:#54694d;font-size:12px;font-weight:500;margin-top:3px}.progress{height:5px;background:#e8ede0;border-radius:9px;margin-top:13px;position:relative;overflow:hidden}.possible,.earned{position:absolute;left:0;top:0;bottom:0;border-radius:9px;transition:width .2s}.possible{background:#dde6cb}.earned{background:#88a766}footer{display:flex;justify-content:space-between;gap:10px;color:#87917f;font-size:10px;padding:25px 2px 5px}.rules{color:var(--muted);font-size:11px;margin:18px 0 0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#223e33;color:#fff;padding:11px 20px;border-radius:12px;box-shadow:0 8px 30px #172d3322;z-index:10}.toast:empty{display:none}@media(min-width:1000px){.hero-stats strong{font-size:40px}}@media(max-width:760px){.topbar{padding:18px 20px}.top-right{gap:8px}.save-status{font-size:10px}.top-right button{font-size:11px;padding:8px 10px}main{padding:22px 16px}.hero{grid-template-columns:1fr;padding:26px;gap:24px;border-radius:20px}h1{font-size:28px}.hero-stats>div{padding-left:15px}.hero-stats strong{font-size:29px}.subjects{grid-template-columns:1fr;gap:16px}.section-head{align-items:flex-start;flex-direction:column;margin-top:25px}.legend{gap:13px}footer{flex-direction:column;gap:4px}.card-head{padding:21px 21px 17px}.fields{padding:0 21px}.card-bottom{padding:17px 21px}.field{grid-template-columns:minmax(0,1fr) 40px 90px;gap:8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="topbar"><div class="brand"><span class="logo" aria-hidden="true">≋</span><div><strong>학기 기록</strong><small>BUSEOK HIGH SCHOOL</small></div></div><div class="top-right"><span class="save-status" id="saveStatus" role="status">자동 저장</span><button id="reset" type="button">전체 초기화</button></div></div></header>
<main>
<section class="hero" aria-label="학기 요약"><div><div class="eyebrow">2026 · SEMESTER 02</div><h1>한 학기의 성장을,<br>한눈에.</h1><p>부석고등학교 1학년 · 2학기 성적 기록</p></div><div class="hero-stats"><div><small>입력 완료</small><strong><span id="complete">0</span><em>/ 6</em></strong></div><div><small>완료 과목 평균</small><strong><span id="average">—</span></strong></div><div><small>A 성취 과목</small><strong><span id="aCount">0</span><em>과목</em></strong></div></div></section>
<div class="section-head"><h2>과목별 성적</h2><div class="legend" aria-label="반올림 후 성취도 기준"><span><b>A</b>90+</span><span><b>B</b>80+</span><span><b>C</b>70+</span><span><b>D</b>60+</span><span><b>E</b>60 미만</span></div></div>
<div class="subjects" id="subjects"></div>
<p class="rules">각 항목 100점 만점 · 반영 점수 합산 후 정수 반올림 · A 89.5 / B 79.5 / C 69.5 / D 59.5점부터</p>
<footer><span>2026학년도 2학기 교수학습 및 평가 운영 계획 기준</span><span>점수는 이 브라우저에 저장됩니다.</span></footer>
</main><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const SUBJECTS=[
 {id:'korean',name:'국어',full:'공통국어2',weights:[20,20,30,30],tasks:['우리동네 돋보기 : 지역 문제 정밀 탐구 보고서','우리 시선으로 쓰는 지역 문제 해결서']},
 {id:'math',name:'수학',full:'공통수학2',weights:[25,25,25,25],tasks:['메타인지 수학일지','수학 자율 탐구 보고서']},
 {id:'english',name:'영어',full:'공통영어2',weights:[20,20,30,30],tasks:['소설 읽고 꼬리 이야기구성하기(Beyond the ending)','미래 사회 혁신 제안서 발표하기']},
 {id:'history',name:'한국사',full:'한국사2',weights:[25,25,25,25],tasks:['근현대사 영화를 통해 나와 타인의 삶 성찰하기','현대사를 소개하는 전시회를 통해 오늘날의 당면 문제 해결하기']},
 {id:'social',name:'통합사회',full:'통합사회2',weights:[20,20,20,20,20],tasks:['국내 사회적 소수자 인권 문제 사례 조사 및 해결 방안 제안서 작성하기','사회 정의 문제 탐구하기','국제 에너지 분쟁 지역의 원인 분석과 해결 방안 제안서 작성하기']},
 {id:'science',name:'통합과학',full:'통합과학2',weights:[20,20,30,30],tasks:['중화 반응 실험','발전소 입지 선정 활동']}
];
const KEY='buseok-semester-2026-2-v1';
const names=s=>['1회고사','2회고사',...s.tasks];
const fmt=n=>Number(n.toFixed(2)).toString();
// Integer arithmetic: hundredths of a raw score × integer percentage.
function scoreUnits(raw){if(typeof raw!=='string'||!/^\d+(?:\.\d{1,2})?$/.test(raw)||Number(raw)>100)return null;return Math.round(Number(raw)*100)}
function grade(units){return units>=895000?'A':units>=795000?'B':units>=695000?'C':units>=595000?'D':'E'}
function calculate(s,values){let earned=0,remaining=0,count=0;for(let i=0;i<s.weights.length;i++){const u=scoreUnits(values[i]);if(u===null)remaining+=10000*s.weights[i];else{earned+=u*s.weights[i];count++}}return {earned,upper:earned+remaining,count,done:count===s.weights.length,grade:count===s.weights.length?grade(earned):null}}
let state={};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object')state=saved}catch{}
for(const s of SUBJECTS)state[s.id]=s.weights.map((_,i)=>scoreUnits(state[s.id]?.[i])!==null?state[s.id][i]:'');
const root=document.getElementById('subjects');
root.innerHTML=SUBJECTS.map((s,si)=>`<section class="subject" aria-labelledby="title-${s.id}"><div class="card-head"><div class="subject-title"><span class="index" aria-hidden="true">${String(si+1).padStart(2,'0')}</span><div><h3 id="title-${s.id}">${s.name}</h3><small>${s.full}</small></div></div><div class="grade" id="grade-${s.id}" aria-label="성취도 미정">—</div></div><div class="fields">${names(s).map((name,i)=>`<div class="field"><label for="${s.id}-${i}"><span class="kind">${i<2?'지필평가':'수행평가 '+(i-1)}</span>${name}</label><span class="weight">${s.weights[i]}%</span><div class="input-wrap"><input id="${s.id}-${i}" data-subject="${s.id}" data-index="${i}" type="number" inputmode="decimal" min="0" max="100" step="0.01" placeholder="—" aria-label="${s.name} ${name} 점수, 100점 만점" aria-describedby="error-${s.id}-${i}" value="${state[s.id][i]}"><span class="unit">점</span></div><div class="field-error" id="error-${s.id}-${i}"></div></div>`).join('')}</div><div class="card-bottom"><div class="result-row"><div><div class="result-label" id="label-${s.id}">반영 점수</div><div class="result-score" id="score-${s.id}">—</div></div><div class="result-detail"><span id="count-${s.id}"></span><strong id="detail-${s.id}"></strong></div></div><div class="progress" aria-hidden="true"><div class="possible" id="possible-${s.id}"></div><div class="earned" id="earned-${s.id}"></div></div></div></section>`).join('');
function refresh(){let completed=[];for(const s of SUBJECTS){const r=calculate(s,state[s.id]);if(r.done)completed.push(r);const g=document.getElementById('grade-'+s.id);g.textContent=r.grade||'—';g.dataset.grade=r.grade||'';g.setAttribute('aria-label','성취도 '+(r.grade||'미정'));document.getElementById('label-'+s.id).textContent=r.done?'최종 반영 점수':'반영 점수 범위';document.getElementById('score-'+s.id).innerHTML=(r.count?fmt(r.earned/10000)+(r.done?'':' – '+fmt(r.upper/10000)):'—')+' <small>/ 100</small>';document.getElementById('count-'+s.id).textContent=`${r.count} / ${s.weights.length} 입력`;document.getElementById('detail-'+s.id).textContent=r.done?`반올림 ${Math.floor((r.earned+5000)/10000)}점 · 성취도 ${r.grade}`:r.count?'나머지 점수 입력 대기':'점수를 입력해 주세요';document.getElementById('possible-'+s.id).style.width=(r.count?r.upper/10000:0)+'%';document.getElementById('earned-'+s.id).style.width=(r.earned/10000)+'%'}document.getElementById('complete').textContent=completed.length;document.getElementById('average').textContent=completed.length?fmt(completed.reduce((a,r)=>a+r.earned,0)/completed.length/10000):'—';document.getElementById('aCount').textContent=completed.filter(r=>r.grade==='A').length}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='자동 저장됨'}catch{document.getElementById('saveStatus').textContent='저장 실패'}}
root.addEventListener('input',e=>{const el=e.target;if(!el.matches('input'))return;if(el.value!==''&&Number(el.value)>100)el.value='100';const empty=el.value===''&&!el.validity.badInput;const valid=scoreUnits(el.value)!==null;el.setAttribute('aria-invalid',String(!empty&&!valid));document.getElementById('error-'+el.id).textContent=!empty&&!valid?'0~100점, 소수 둘째 자리까지 입력':'';state[el.dataset.subject][Number(el.dataset.index)]=valid?el.value:'';save();refresh()});
document.getElementById('reset').addEventListener('click',()=>{if(!confirm('6개 과목의 모든 점수를 초기화할까요?'))return;for(const s of SUBJECTS)state[s.id]=s.weights.map(()=>'');root.querySelectorAll('input').forEach(el=>{el.value='';el.removeAttribute('aria-invalid')});root.querySelectorAll('.field-error').forEach(el=>el.textContent='');save();refresh();const t=document.getElementById('toast');t.textContent='모든 점수를 초기화했어요';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.textContent='',2200)});
refresh();
</script>
</body></html>
