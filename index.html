const SUBJECTS=['수학','국어','한국사','영어','사회','과학'],KEY='exam-2026-term2-first-v2';
const blank=()=>({v:1,subjects:SUBJECTS.map(name=>({name,questions:[]}))});
let state=blank(),active=0,saveError=false;
let savedAnswers={};try{savedAnswers=JSON.parse(localStorage.getItem(KEY))||{}}catch{}
function valid(s){return s?.v===1&&Array.isArray(s.subjects)&&s.subjects.length===6&&s.subjects.every((x,i)=>x.name===SUBJECTS[i]&&Array.isArray(x.questions)&&x.questions.every(q=>['mc','short','essay'].includes(q.type)&&['answer','key','points','score','rubric','text'].every(k=>typeof q[k]==='string')))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(s){return s!==''&&Number.isFinite(Number(s))&&Number(s)>=0?Number(s):null}
function result(q){const p=num(q.points);if(p===null)return {p:null,got:null};if(q.type==='essay'){const v=num(q.score);return {p,got:v!==null&&v<=p?v:null}}if(!q.answer.trim()||!q.key.trim())return {p,got:null};return {p,got:q.type==='mc'?(q.answer===q.key?p:0):(q.key.split('|').map(x=>x.trim()).includes(q.answer.trim())?p:0)}}
function totals(s){let lo=0,pending=0,total=0,missing=0;for(const q of s.questions){const r=result(q);if(r.p===null){missing++;continue}total+=r.p;if(r.got===null)pending+=r.p;else lo+=r.got}return {lo,hi:lo+pending,pending,total,missing}}
const fmt=n=>Number(n.toFixed(2)).toString();
function range(s){const t=totals(s);return !s.questions.length?'—':t.missing?'배점 미정':fmt(t.lo)+(t.hi!==t.lo?'–'+fmt(t.hi):'')}
function save(){try{const answers={};state.subjects.forEach(s=>s.questions.forEach(q=>answers[q.id]={answer:q.answer,score:q.score}));localStorage.setItem(KEY,JSON.stringify(answers));saveError=false}catch{saveError=true}document.getElementById('saved').textContent=saveError?'저장 실패 · 브라우저 저장 공간 확인':'브라우저 자동 저장'}
function notify(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2300)}
function field(q,i,k,label,kind='text'){return `<div><label for="${i}-${k}">${label}</label><${kind==='textarea'?'textarea':'input'} id="${i}-${k}" data-i="${i}" data-k="${k}" ${kind==='number'?`type="number" min="0" step="0.1" ${k==='score'?(num(q.points)!==null?'max="'+num(q.points)+'"':'disabled'):''}`:''} ${kind==='textarea'?'':`value="${esc(q[k])}"`}>${kind==='textarea'?esc(q[k])+'</textarea>':''}</div>`}
function question(q,i){const r=result(q),status=r.got===null?'미정':fmt(r.got)+'점';return `<article class="question"><div class="row"><strong>${esc(q.number)}번 <span class="badge" data-status="${i}">${status}</span></strong><small>${q.points?esc(q.points)+'점':'배점 미정'}</small></div><div class="grid">${q.type==='mc'?`<div class="wide"><label>내 답</label><div class="choices">${[1,2,3,4,5].map(n=>`<button data-choice="${i}" data-val="${n}" class="${q.answer==n?'selected':''}" aria-pressed="${q.answer==n}">${n}</button>`).join('')}<button data-choice="${i}" data-val="" aria-label="답 지우기">×</button></div></div>`:field(q,i,'answer','내 답','textarea')}${q.type!=='mc'?`<div class="answer-box"><label>${q.type==='short'?'정답':'예시 답안'}</label><div class="model-answer">${esc(q.key?q.key.split('|').join(' / '):'미등록')}</div></div>`:''}${q.type==='essay'?`<div class="grade-box">${field(q,i,'score','가채점 점수','number')}</div>`:''}${q.type==='essay'?`<div class="wide"><label>채점 기준</label><div style="white-space:pre-wrap">${esc(q.rubric||'미등록')}</div><button style="margin-top:12px" data-prompt="${i}">AI 채점 프롬프트 복사</button><span class="err" data-error="${i}"></span></div>`:''}${q.text?`<details class="wide"><summary>문제</summary><div style="white-space:pre-wrap">${esc(q.text)}</div></details>`:''}</div></article>`}
let writtenType='all';
function updateScores(){state.subjects.forEach((s,i)=>{const e=document.querySelector(`[data-tab="${i}"] span`);if(e)e.textContent=range(s)+(s.questions.length?' 점':'')});const s=state.subjects[active],t=totals(s);document.getElementById('scoreValue').textContent=range(s);document.getElementById('metrics').innerHTML=`<span>확정 ${fmt(t.lo)}점</span><span>미정 ${fmt(t.pending)}점</span><span>배점 ${t.missing?'미정 '+t.missing+'문항':fmt(t.total)+'점'}</span>`;document.getElementById('scoreTrack').style.width=(t.total?t.lo/t.total*100:0)+'%';s.questions.forEach((q,i)=>{const e=document.querySelector(`[data-status="${i}"]`);if(e){const r=result(q);e.textContent=r.got===null?'미정':fmt(r.got)+'점'}const err=document.querySelector(`[data-error="${i}"]`);if(err)err.textContent=num(q.score)!==null&&num(q.points)!==null&&num(q.score)>num(q.points)?' 배점을 초과했어요':''})}
function render(){document.getElementById('tabs').innerHTML=state.subjects.map((s,i)=>`<button class="tab ${i===active?'active':''}" data-tab="${i}"><strong>${s.name}</strong><span>${range(s)}${s.questions.length?' 점':''}</span></button>`).join('');const s=state.subjects[active];document.getElementById('app').innerHTML=`<section class="panel"><div class="row"><div><small>예상 점수</small><h2>${s.name}</h2></div><div class="score"><span id="scoreValue"></span> <small>${s.questions.length?'점':''}</small></div></div><div class="metrics" id="metrics"></div><div class="track"><div id="scoreTrack"></div></div></section><section class="panel"><div class="heading"><h3>선택형</h3></div>${s.questions.some(q=>q.type==='mc')?'<div class="batch"><input id="batch" inputmode="numeric" placeholder="답 한 줄 입력 · 12345 (미정은 ?)"><button id="batchApply" class="primary">적용</button></div>':''}${s.questions.some(q=>q.type==='mc')?s.questions.map((q,i)=>q.type==='mc'?question(q,i):'').join(''):'<div class="empty">등록된 문항 없음</div>'}</section><section class="panel"><div class="heading"><h3>서답형</h3><div class="tools">${[['all','전체'],['short','단답형'],['essay','서술형']].map(([v,l])=>`<button data-filter="${v}" class="${writtenType===v?'primary':''}">${l}</button>`).join('')}</div></div>${s.questions.some(q=>q.type!=='mc'&&(writtenType==='all'||q.type===writtenType))?s.questions.map((q,i)=>q.type!=='mc'&&(writtenType==='all'||q.type===writtenType)?`<div><small class="badge">${q.type==='short'?'단답형':'서술형'}</small>${question(q,i)}</div>`:'').join(''):'<div class="empty">등록된 문항 없음</div>'}</section>`;updateScores()}
function captureInput(e){const k=e.target.dataset.k;if(!['answer','score'].includes(k))return;const q=state.subjects[active].questions[Number(e.target.dataset.i)];if(k==='score'&&e.target.value!==''){const p=num(q.points),v=Number(e.target.value);if(p===null){e.target.value='';q.score='';save();updateScores();return}if(!Number.isFinite(v)){e.target.value='';}else{e.target.value=String(Math.min(p,Math.max(0,v)))}}q[k]=e.target.value;save();updateScores()}
document.addEventListener('input',captureInput);
document.addEventListener('compositionend',captureInput);
async function copy(s){try{await navigator.clipboard.writeText(s);notify('복사 완료')}catch{const a=document.createElement('textarea');a.value=s;document.body.append(a);a.select();const ok=document.execCommand('copy');a.remove();if(ok)notify('복사 완료');else window.prompt('복사할 내용',s)}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const s=state.subjects[active];if(b.dataset.tab!==undefined){active=Number(b.dataset.tab);render()}if(b.dataset.filter){writtenType=b.dataset.filter;render()}if(b.dataset.choice!==undefined){s.questions[Number(b.dataset.choice)].answer=b.dataset.val;save();render()}if(b.id==='batchApply'){const raw=document.getElementById('batch').value.replace(/\s/g,'');const qs=s.questions.filter(q=>q.type==='mc');if(!/^[1-5?]+$/.test(raw)||raw.length!==qs.length){notify(`1–5 또는 ?로 ${qs.length}개 입력`);return}qs.forEach((q,i)=>q.answer=raw[i]==='?'?'':raw[i]);save();render()}if(b.dataset.prompt!==undefined){const q=s.questions[Number(b.dataset.prompt)];await copy(`다음 ${s.name} 서술형 답안을 채점해 줘.\n문제: ${q.text||'[문제 입력]'}\n배점: ${q.points||'[배점 입력]'}점\n채점 기준: ${q.rubric||'[채점 기준 입력]'}\n예시 답안: ${q.key||'[예시 답안 미등록]'}\n내 답: ${q.answer||'[답안 입력]'}\n제공된 기준만 적용하고 점수, 기준별 판단, 감점 이유를 제시해 줘. 자료가 부족하면 추측하지 말고 미정으로 표시해 줘. 최종 점수는 0점부터 배점 이내로 제시해 줘.`)}if(b.id==='reset'){if(confirm('모든 과목의 답안과 가채점 점수를 초기화할까요?')){state.subjects.forEach(s=>s.questions.forEach(q=>{q.answer='';q.score=''}));savedAnswers={};save();render();notify('전체 초기화 완료')}return}if(b.id==='share'){const url=location.protocol==='file:'?'':location.href.split('#')[0];try{if(navigator.share&&url)await navigator.share({title:document.title,url});else if(url)await copy(url);else notify('사이트 주소에서 공유할 수 있어요')}catch(err){if(err.name!=='AbortError')await copy(url)}}});
async function loadExam(){try{const response=await fetch('./exam-config.json',{cache:'no-store'});if(!response.ok)throw Error();const config=await response.json();const ids=new Set();if(config.subjects?.length!==6)throw Error();state={v:1,subjects:config.subjects.map((s,i)=>{if(s.name!==SUBJECTS[i]||!Array.isArray(s.questions))throw Error();return {name:s.name,questions:s.questions.map(q=>{if(typeof q.id!=='string'||!q.id||ids.has(q.id)||!['mc','short','essay'].includes(q.type)||typeof q.number!=='string'||typeof q.points!=='string'||(q.points!==''&&num(q.points)===null)||typeof q.key!=='string'||typeof q.rubric!=='string'||typeof q.text!=='string'||(q.type==='mc'&&!/^[1-5]?$/.test(q.key)))throw Error();ids.add(q.id);const saved=savedAnswers[q.id]||{};return {...q,answer:typeof saved.answer==='string'?saved.answer:'',score:typeof saved.score==='string'?saved.score:''}})}})};render()}catch{document.getElementById('app').innerHTML='<section class="panel empty">문항 설정을 불러오지 못했어요. 새로고침해 주세요.</section>'}}
render();loadExam();
</script></html>
